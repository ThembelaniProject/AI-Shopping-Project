{% load static %}

<nav class="navbar">
    <div class="navbar-container">

        <a href="{% url 'shopping:dashboard' %}" class="navbar-brand">
            <img
                src="{% static 'images/logo-SMARTSPEND-72dpi.png' %}"
                alt="AI Shopping Logo"
                class="navbar-logo"
            >
        </a>

        <div class="navbar-links">

            <a href="{% url 'shopping:dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'products:search' %}">
                Products
            </a>

            {% if user.is_authenticated %}
                <a
                    href="{% url 'accounts:profile' %}"
                    class="profile-link"
                >
                    <span class="profile-icon">👤</span>
                    <span>Profile</span>
                </a>

                <span class="navbar-user">
                    Welcome, {{ user.username }}
                </span>

                <form
                    method="post"
                    action="{% url 'accounts:logout' %}"
                    style="display: inline;"
                >
                    {% csrf_token %}
                    <button type="submit">
                        Logout
                    </button>
                </form>
            {% endif %}

        </div>
    </div>
</nav>

<style>
    .navbar {
        width: 100%;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        position: relative;
        z-index: 1000;
    }

    .navbar-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .navbar-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #a5b4fc;
        text-decoration: none;
        white-space: nowrap;
    }

    .navbar-logo {
        width: 150px;
        height: 45px;
        object-fit: contain;
        display: block;
    }

    .navbar-links {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .navbar-links a {
        color: #cbd5e1;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
    }

    .navbar-links a:hover {
        color: #a5b4fc;
    }

    .profile-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.45rem 0.7rem;
        border-radius: 8px;
        background: rgba(99, 102, 241, 0.10);
        border: 1px solid rgba(99, 102, 241, 0.25);
    }

    .profile-link:hover {
        background: rgba(99, 102, 241, 0.2);
        border-color: #6366f1;
    }

    .profile-icon {
        font-size: 1rem;
        line-height: 1;
    }

    .navbar-user {
        color: #94a3b8;
        font-size: 0.85rem;
    }

    .navbar-links button {
        border: 1px solid #475569;
        background: #0f172a;
        color: #cbd5e1;
        padding: 0.45rem 0.75rem;
        border-radius: 8px;
        cursor: pointer;
    }

    .navbar-links button:hover {
        border-color: #6366f1;
        color: white;
    }

    @media (max-width: 700px) {
        .navbar-container {
            padding: 0.9rem 1rem;
        }

        .navbar-links {
            gap: 0.6rem;
        }

        .navbar-user {
            display: none;
        }

        .navbar-logo {
            width: 38px;
            height: 38px;
        }
    }
</style>
