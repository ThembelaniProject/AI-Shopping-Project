{% extends "base.html" %}

{% block title %}
Redirecting to PayFast
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card bg-dark text-white border-secondary shadow">

        <div class="card-body text-center py-5">

            <div
                class="spinner-border text-success mb-4"
                role="status"
            ></div>

            <h1 class="h4 mb-3">
                Redirecting to PayFast
            </h1>

            <p class="text-secondary mb-4">
                Please wait while we securely redirect
                you to PayFast.
            </p>

            <p class="small text-secondary">
                Order #{{ order.id }}
            </p>

            <form
                id="payfast-form"
                method="POST"
                action="{{ payfast_url }}"
            >

                {% for key, value in payfast_data.items %}

                    <input
                        type="hidden"
                        name="{{ key }}"
                        value="{{ value }}"
                    >

                {% endfor %}

                <noscript>
                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Continue to PayFast
                    </button>
                </noscript>

            </form>

        </div>

    </div>

</div>

<script>
document.addEventListener(
    "DOMContentLoaded",
    function () {

        document
            .getElementById("payfast-form")
            .submit();

    }
);
</script>

{% endblock %}
