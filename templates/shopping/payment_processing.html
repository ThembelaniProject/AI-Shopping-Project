<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Processing Payment</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 25px;
            border: 5px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .error {
            color: #dc2626;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="spinner"></div>

    <h1 id="title">Processing your payment</h1>

    <p id="message">
        Please wait while we confirm your payment.
    </p>

</div>

<script>

    const statusUrl = "{% url 'shopping:payfast_payment_status' order.id %}";
    const successUrl = "{% url 'shopping:order_success' order.id %}";
    const orderDetailUrl = "{% url 'shopping:order_detail' order.id %}";

    async function checkPaymentStatus() {

        try {

            const response = await fetch(statusUrl, {
                method: "GET",
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                },
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Unable to check payment status.");
            }

            const data = await response.json();

            console.log("Payment status:", data);

            // ------------------------------------------
            // PAYMENT SUCCESSFUL
            // ------------------------------------------

            if (data.paid === true) {

                document.getElementById("title").textContent =
                    "Payment successful!";

                document.getElementById("message").textContent =
                    "Redirecting to your order...";

                window.location.href = successUrl;

                return;
            }

            // ------------------------------------------
            // PAYMENT FAILED
            // ------------------------------------------

            if (data.status === "failed") {

                document.getElementById("title").textContent =
                    "Payment failed";

                document.getElementById("message").textContent =
                    "Your payment could not be completed. Redirecting...";

                setTimeout(function () {
                    window.location.href = orderDetailUrl;
                }, 2000);

                return;
            }

            // ------------------------------------------
            // PAYMENT CANCELLED
            // ------------------------------------------

            if (data.status === "cancelled") {

                document.getElementById("title").textContent =
                    "Payment cancelled";

                document.getElementById("message").textContent =
                    "Your payment was cancelled. Redirecting...";

                setTimeout(function () {
                    window.location.href = orderDetailUrl;
                }, 2000);

                return;
            }

            // ------------------------------------------
            // STILL PENDING
            // ------------------------------------------

            setTimeout(checkPaymentStatus, 2000);

        } catch (error) {

            console.error(
                "Payment status check failed:",
                error
            );

            // Try again in 3 seconds
            setTimeout(checkPaymentStatus, 3000);
        }
    }

    // Start checking
    checkPaymentStatus();

</script>

</body>
</html>
