{% extends "base.html" %}

{% block title %}
Edit Preferences - AI Shopping
{% endblock %}

{% block content %}

<div class="container py-5">
<div class="card bg-dark text-white border-secondary shadow">

    <div class="card-body p-4">

        <h1 class="mb-3">
            Edit My Preferences
        </h1>

        <p class="text-secondary mb-4">
            Update your shopping preferences below.
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Styles
                </label>

                <input
                    type="text"
                    name="styles"
                    class="form-control"
                    value="{{ preference.styles }}"
                    placeholder="e.g. casual, sport, formal"
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Colours
                </label>

                <input
                    type="text"
                    name="colours"
                    class="form-control"
                    value="{{ preference.colours }}"
                    placeholder="e.g. black, blue, white"
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Preferred Stores
                </label>

                <input
                    type="text"
                    name="stores"
                    class="form-control"
                    value="{{ preference.stores }}"
                    placeholder="e.g. Nike, Adidas"
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Hobbies
                </label>

                <input
                    type="text"
                    name="hobbies"
                    class="form-control"
                    value="{{ preference.hobbies }}"
                    placeholder="e.g. running, gaming, gym"
                >

            </div>


            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Save Changes
                </button>

                <a
                    href="{% url 'preferences:preferences' %}"
                    class="btn btn-outline-light"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</div>

{% endblock %}
