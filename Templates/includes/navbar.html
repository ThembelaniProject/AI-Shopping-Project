
<nav class="navbar">

    <div class="navbar-container">

        <a
            href="{% url 'shopping:dashboard' %}"
            class="navbar-brand"
        >
            AI Shopping
        </a>


        <div class="navbar-links">

            <a href="{% url 'shopping:dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'products:search' %}">
                Products
            </a>

            <a
    href="{% url 'preferences:preferences' %}"
    class="nav-link"
>
    My Preferences
</a>


<a
    href="{% url 'shopping:order_history' %}"
    class="btn btn-outline-success"
>
    My Orders
</a>



            <!-- =========================
                 CART
            ========================== -->

            <a
                href="{% url 'shopping:cart' %}"
                class="cart-link"
                aria-label="Shopping cart"
            >

                <span class="cart-icon">
                    🛒
                </span>

                <span
                    id="cart-count"
                    class="cart-count"
                >
                    {{ cart_count|default:0 }}
                </span>

            </a>


            {% if user.is_authenticated %}

                <span class="navbar-user">
                    Welcome, {{ user.username }}
                </span>

                <form
                    method="post"
                    action="{% url 'accounts:logout' %}"
                    style="display: inline;"
                >

                    {% csrf_token %}

                    <button type="submit">
                        Logout
                    </button>

                </form>

            {% endif %}

        </div>

    </div>

</nav>


<style>

    .navbar {
        width: 100%;

        background: #1e293b;

        border-bottom:
            1px solid
            #334155;

        position: relative;

        z-index: 1000;
    }


    .navbar-container {
        max-width: 1200px;

        margin: 0 auto;

        padding:
            1rem
            2rem;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 1rem;
    }


    .navbar-brand {
        color: #a5b4fc;

        font-size: 1.2rem;

        font-weight: 700;

        text-decoration: none;
    }


    .navbar-brand:hover {
        color: #c7d2fe;
    }


    .navbar-links {
        display: flex;

        align-items: center;

        gap: 1rem;
    }


    .navbar-links a {
        color: #cbd5e1;

        text-decoration: none;

        font-size: 0.9rem;

        font-weight: 500;
    }


    .navbar-links a:hover {
        color: #a5b4fc;
    }


    /* =========================
       CART
    ========================= */

    .cart-link {
        position: relative;

        display: inline-flex !important;

        align-items: center;

        justify-content: center;

        width: 42px;

        height: 42px;

        border-radius: 10px;

        background: #0f172a;

        border: 1px solid #475569;

        color: white !important;

        text-decoration: none;

        transition:
            background 0.2s ease,
            border-color 0.2s ease,
            transform 0.2s ease;
    }


    .cart-link:hover {
        background: #334155;

        border-color: #6366f1;

        color: white !important;

        transform: translateY(-1px);
    }


    .cart-icon {
        font-size: 1.25rem;

        line-height: 1;
    }


    .cart-count {
        position: absolute;

        top: -7px;

        right: -7px;

        min-width: 20px;

        height: 20px;

        padding:
            0 5px;

        display: flex;

        align-items: center;

        justify-content: center;

        background: #ef4444;

        color: white;

        border-radius: 999px;

        font-size: 0.7rem;

        font-weight: 700;

        line-height: 1;

        border: 2px solid #1e293b;
    }


    .navbar-user {
        color: #94a3b8;

        font-size: 0.85rem;
    }


    .navbar-links button {
        border: 1px solid #475569;

        background: #0f172a;

        color: #cbd5e1;

        padding:
            0.45rem
            0.75rem;

        border-radius: 8px;

        cursor: pointer;
    }


    .navbar-links button:hover {
        border-color: #6366f1;

        color: white;
    }


    /* =========================
       CART COUNT ANIMATION
    ========================= */

    .cart-count.bump {
        animation: cartBump 0.35s ease;
    }


    @keyframes cartBump {

        0% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.35);
        }

        100% {
            transform: scale(1);
        }

    }


    @media (max-width: 700px) {

        .navbar-container {
            padding:
                0.9rem
                1rem;
        }

        .navbar-links {
            gap: 0.6rem;
        }

        .navbar-user {
            display: none;
        }

    }

</style>
